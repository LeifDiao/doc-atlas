<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>doc-atlas</title>
<!-- Chart.js 与 Mermaid：渲染器默认把 templates/vendor/ 里的两库内联到此处，
     输出完全自包含、零网络请求；--cdn 时改为注入 CDN <script src> 标签。 -->
<!-- __VENDOR_JS__ -->
<style>
/* =====================================================================
   doc-atlas · 纸本简报 (paper briefing) —— 固定皮肤
   暖米纸 + 蓝强调（重点/风险朱红）+ 无衬线正文 + 日读。
   信息结构固定为一条主线：定论 → 编号简报区（指标/摘要/逻辑图/图表/
   要点/冲突/金句）→ 章节详情（折叠）→ 附录（降调：源文件/关系/体检）。
   一页只有一种大数字（highlights）；正文占满内容宽度，不做窄栏限宽。
   皮肤由本模板一处定死（SKILL 约束：AI 不改皮肤、不提供外观切换面板）。
   ===================================================================== */
:root{
  --sidebar-w:300px;
  --serif:"Songti SC","STSong","Source Han Serif SC","Noto Serif SC","Noto Serif CJK SC",Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --content-pad:clamp(32px,5.5vw,96px);

  --bg:#efe8d8;            /* 桌面色 */
  --paper:#faf6ee;         /* 纸面 */
  --panel:#fffdf7;         /* 抬起的卡片纸 */
  --panel-2:#f1e9d9;       /* 凹陷/表头 */
  --border:#e3d9c4;        /* 发丝线 */
  --rule:#cdbf9f;          /* 较重分隔线 */
  --text:#272019;          /* 墨黑（暖） */
  --muted:#6a5f4e;
  --faint:#998b73;
  --accent:#2b5fb0;        /* 主强调：蓝 */
  --high:#b23a2e;          /* 重点/风险：朱红 */
  --warn:#a9761c;
  --ok:#217a4b;
  --info:#2b5fb0; --success:#217a4b; --danger:#b23a2e;
  --mark:#f7e08a; --mark-ink:#4a3a07;
  --shadow:0 1px 1px rgba(70,55,25,.05),0 10px 26px rgba(80,60,25,.07);
  --shadow-sm:0 1px 2px rgba(70,55,25,.06);
  /* 图表五色（已过明度带/色度/CVD/对比度校验，勿随意改） */
  --c1:#2b5fb0; --c2:#b23a2e; --c3:#a9761c; --c4:#217a4b; --c5:#0d7fa5;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
  font-family:var(--sans);font-size:16.5px;line-height:1.72;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
html{scrollbar-gutter:stable;overflow-y:scroll}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline;text-underline-offset:2px}
::selection{background:var(--mark);color:var(--mark-ink)}

/* ===================== 布局 ===================== */
#layout{display:flex;min-height:100vh}
#sidebar{position:fixed;top:0;left:0;width:var(--sidebar-w);height:100vh;
  background:var(--paper);border-right:1px solid var(--rule);
  overflow-y:auto;scrollbar-gutter:stable;padding:26px 20px 40px;z-index:20}
#sidebar::-webkit-scrollbar{width:8px}
#sidebar::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;border:2px solid var(--paper)}
#main{margin-left:var(--sidebar-w);flex:1;min-width:0;background:var(--paper);
  padding:0 var(--content-pad) 90px}
.sheet{max-width:1280px;margin:0 auto}

/* 移动端断点（与 JS 的 MOBILE_BP 保持一致） */
@media (max-width:920px){
  #sidebar{transform:translateX(-100%);transition:transform .25s ease;box-shadow:var(--shadow);width:290px}
  #sidebar.open{transform:translateX(0)}
  #main{margin-left:0;padding:0 20px 60px}
  #menu-toggle{display:inline-flex !important}
  #main .masthead{padding-top:72px}
}
#sb-backdrop{display:none;position:fixed;inset:0;background:rgba(20,15,8,.45);z-index:16}
#sb-backdrop.show{display:block}
#menu-toggle{display:none;align-items:center;justify-content:center;width:40px;height:40px;
  border:1px solid var(--rule);background:var(--panel);color:var(--text);border-radius:4px;cursor:pointer;
  position:fixed;top:14px;left:14px;z-index:15;box-shadow:var(--shadow-sm)}

/* ===================== 侧栏 ===================== */
.brand-kicker{font-size:10px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--accent)}
.brand{font-family:var(--serif);font-weight:700;font-size:17px;line-height:1.4;margin:8px 0 0;color:var(--text)}
.brand small{display:block;color:var(--faint);font-weight:400;font-size:11px;margin-top:6px;font-family:var(--sans)}
.brand-rule{border:0;border-top:1px solid var(--rule);margin:16px 0;position:relative}
.brand-rule::after{content:"";position:absolute;left:0;top:2px;width:38px;border-top:2px solid var(--accent)}

.mode-btn{width:100%;border:1px solid var(--accent);background:var(--accent);color:#fff;
  border-radius:3px;padding:9px 10px;cursor:pointer;font-size:12.5px;font-weight:700;
  font-family:var(--sans);letter-spacing:.04em;margin-bottom:16px}
.mode-btn:hover{filter:brightness(1.07)}

.nav-title{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);
  font-weight:700;margin:20px 0 8px;padding-bottom:5px;border-bottom:1px solid var(--border)}
.nav-brief a{display:flex;align-items:baseline;gap:10px;padding:5px 7px;border-radius:4px;
  color:var(--muted);font-size:13px}
.nav-brief a:hover{background:var(--panel-2);color:var(--text);text-decoration:none}
.nav-brief a .no{font-family:var(--serif);font-size:11px;color:var(--faint);
  font-variant-numeric:tabular-nums;min-width:18px}
.nav-brief a.active{color:var(--text);box-shadow:inset 2px 0 0 var(--accent)}
.nav-brief a.active .no{color:var(--accent)}

ul.tree{list-style:none;margin:0;padding:0}
ul.tree ul{list-style:none;margin:0;padding-left:14px;border-left:1px solid var(--border)}
ul.tree li{margin:0}
.tree-row{display:flex;align-items:center;gap:7px;padding:4px 7px;border-radius:4px;cursor:pointer;color:var(--muted);font-size:13px}
.tree-row:hover{background:var(--panel-2);color:var(--text)}
.tree-row.active{color:var(--text);box-shadow:inset 2px 0 0 var(--accent);border-radius:0 4px 4px 0}
.tree-row.active .tw-id{color:var(--accent)}
.tree-row .tw-id{color:var(--faint);font-size:11px;min-width:24px;font-variant-numeric:tabular-nums}
.tree-row .tw-title{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tree-row .dot{width:6px;height:6px;border-radius:50%;flex:0 0 auto;background:var(--rule)}
.dot.high{background:var(--high)} .dot.medium{background:var(--warn)} .dot.low{background:var(--ok)}
.toggle{width:13px;text-align:center;color:var(--faint);font-size:10px;user-select:none}
li.collapsed > ul{display:none}

details.tools{margin-top:22px;border-top:1px solid var(--border);padding-top:10px}
details.tools summary{cursor:pointer;font-size:10px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--faint);font-weight:700;user-select:none;list-style:none;display:flex;align-items:center;gap:6px}
details.tools summary::-webkit-details-marker{display:none}
details.tools summary::before{content:"▸";font-size:9px}
details.tools[open] summary::before{content:"▾"}
details.tools .tools-body{margin-top:12px;display:flex;flex-direction:column;gap:12px}
.search-box{position:relative}
.search-box input{width:100%;background:var(--panel);border:1px solid var(--border);border-radius:3px;
  color:var(--text);padding:8px 26px 8px 12px;font-size:13px;outline:none;font-family:var(--sans)}
.search-box input::placeholder{color:var(--faint)}
.search-box input:focus{border-color:var(--accent)}
.search-box #q-clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:none;background:transparent;
  color:var(--faint);cursor:pointer;font-size:18px;line-height:1;display:none;padding:0 4px}
.search-box.has-val #q-clear{display:block}
.q-count{font-size:11px;color:var(--muted);margin-top:-6px;font-family:var(--sans)}
.fg-label{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-bottom:6px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--sans);font-size:12px;padding:3px 10px;border-radius:3px;border:1px solid var(--border);background:var(--panel);
  color:var(--text);cursor:pointer;user-select:none;display:inline-flex;align-items:center;gap:6px;max-width:100%}
.chip:hover{border-color:var(--accent)}
.chip .cdot{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
.chip .ctxt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.imp-high .cdot{background:var(--high)} .chip.imp-medium .cdot{background:var(--warn)} .chip.imp-low .cdot{background:var(--ok)}
.chip.off{opacity:.42;text-decoration:line-through;border-style:dashed}
mark.search-hit{background:var(--mark);color:var(--mark-ink);border-radius:2px;padding:0 1px}

/* ===================== 报头 ===================== */
.masthead{padding-top:44px}
.mh-top{display:flex;justify-content:space-between;gap:16px;font-size:10.5px;font-weight:600;
  letter-spacing:.22em;text-transform:uppercase;color:var(--accent);
  padding-bottom:10px;border-bottom:2px solid var(--text)}
.mh-top .mh-right{color:var(--faint);font-weight:500;letter-spacing:.08em}
.doc-title{font-family:var(--serif);font-size:clamp(26px,3.2vw,40px);line-height:1.22;font-weight:700;
  margin:22px 0 0;letter-spacing:-.01em;color:var(--text);text-wrap:pretty}
.doc-meta{margin-top:14px;color:var(--muted);font-size:13px;display:flex;flex-wrap:wrap;gap:6px 0}
.doc-meta span+span::before{content:"·";margin:0 9px;color:var(--faint)}
.doc-meta b{color:var(--text);font-weight:600}
.doc-meta .save{color:var(--accent);font-weight:600}
.doc-meta .goal{color:var(--muted)}
.doc-meta .goal b{color:var(--accent)}

/* ===================== 定论条 ===================== */
.verdict{margin-top:30px;padding:24px 0 26px;border-top:2px solid var(--text);border-bottom:1px solid var(--rule)}
.verdict .v-label{font-size:10.5px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--accent);margin-bottom:12px}
.verdict .v-text{font-family:var(--serif);font-size:clamp(20px,2.2vw,26px);line-height:1.55;font-weight:600;text-wrap:pretty}

/* ===================== 分区（编号制） ===================== */
section{padding:46px 0 0;scroll-margin-top:14px}
.sec-head{display:flex;align-items:baseline;gap:12px;margin-bottom:22px}
.sec-head .no{font-family:var(--serif);color:var(--accent);font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.sec-head h2{font-family:var(--serif);font-size:22px;font-weight:700;margin:0;letter-spacing:-.005em;color:var(--text)}
.sec-head .line{flex:1;border-top:1px solid var(--border);transform:translateY(-4px)}
.sec-head .cnt{color:var(--faint);font-size:11.5px;letter-spacing:.06em;white-space:nowrap}

/* ===================== 来源角标（全站唯一样式） ===================== */
.srcs{display:inline-flex;flex-wrap:wrap;gap:4px 10px;margin-top:9px}
.src{font-family:var(--sans);font-size:10.5px;color:var(--faint);letter-spacing:.02em;white-space:nowrap}
.src::before{content:"▸ ";color:var(--rule)}
.src b{color:var(--muted);font-weight:500}

/* 数字高亮（只用于定论/摘要/重点要点） */
mark.hl{background:linear-gradient(180deg,transparent 55%,var(--mark) 55%);color:inherit;padding:0 1px;
  font-weight:600;border-radius:1px}

/* 重要度徽章（低调版，仅章节头/子节用） */
.badge{font-family:var(--sans);font-size:10px;font-weight:700;border-radius:3px;padding:2px 8px;
  border:1px solid var(--border);color:var(--muted);letter-spacing:.06em;
  display:inline-flex;align-items:center;gap:5px;text-transform:uppercase;white-space:nowrap}
.badge.high{color:var(--high);border-color:var(--high)}
.badge.medium{color:var(--warn);border-color:var(--warn)}
.badge.low{color:var(--ok);border-color:var(--ok)}

/* ===================== 关键指标（唯一大数字区） ===================== */
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0;
  border:1px solid var(--border);border-radius:4px;overflow:hidden;background:var(--panel)}
.metric{padding:20px 22px 16px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);
  border-top:3px solid var(--accent)}
.metric.high{border-top-color:var(--high)}
.metric .mv{font-family:var(--serif);font-size:clamp(28px,2.8vw,36px);font-weight:700;line-height:1.05;
  color:var(--text);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.metric.high .mv{color:var(--high)}
.metric .ml{font-size:11.5px;color:var(--muted);margin-top:8px;letter-spacing:.05em}
.metric .msub{font-size:11px;color:var(--faint);margin-top:2px}

/* ===================== 执行摘要 ===================== */
.abstract ol{margin:0;padding:0;list-style:none;counter-reset:ab;columns:520px;column-gap:56px}
.abstract li{break-inside:avoid;margin:0 0 16px;padding-left:38px;position:relative;counter-increment:ab;
  font-size:16.5px;line-height:1.75;color:var(--text)}
.abstract li::before{content:counter(ab,decimal-leading-zero);position:absolute;left:0;top:.32em;
  font-family:var(--serif);font-size:13px;font-weight:700;color:var(--accent)}
.abstract li::after{content:"";position:absolute;left:0;top:1.75em;width:22px;border-top:1px solid var(--border)}

/* ===================== 核心逻辑（主角，大幅） ===================== */
.stage{background:var(--panel);border:1px solid var(--border);border-top:3px solid var(--accent);
  border-radius:4px;padding:26px 26px 20px;box-shadow:var(--shadow-sm);margin-bottom:18px}
.stage:last-child{margin-bottom:0}
.stage .fig-title{font-family:var(--serif);font-weight:700;font-size:18px;margin:0 0 6px;color:var(--text)}
.stage .fig-lead{color:var(--muted);font-size:13.5px;margin:0 0 18px}
.diagram-wrap{position:relative;text-align:center;overflow:auto;min-height:280px;
  display:flex;flex-direction:column;justify-content:center;cursor:zoom-in}
.diagram-wrap .mermaid{display:inline-block;min-width:50px;width:100%}
.diagram-wrap .mermaid svg{max-width:100%;height:auto}
.diagram-zoom{position:absolute;top:0;right:0;font-family:var(--sans);border:1px solid var(--border);background:var(--panel);
  color:var(--muted);border-radius:3px;padding:3px 10px;font-size:11px;cursor:zoom-in;z-index:2;letter-spacing:.04em}
.diagram-zoom:hover{border-color:var(--accent);color:var(--accent)}
.fig-foot{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap;
  border-top:1px solid var(--border);margin-top:16px;padding-top:10px}
.fig-foot .srcs{margin-top:0}
.fig-cap{color:var(--muted);font-size:12.5px;font-style:italic}

/* ===================== 数据图表 ===================== */
.chart-grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(420px,1fr))}
@media (max-width:560px){.chart-grid{grid-template-columns:1fr}}
.chart-box{background:var(--panel);border:1px solid var(--border);border-radius:4px;padding:22px 22px 14px}
.chart-box .fig-title{font-family:var(--serif);font-weight:700;font-size:16.5px;margin:0 0 14px;color:var(--text)}
.chart-canvas-box{position:relative;height:280px}

/* ===================== 核心要点（分级列表） ===================== */
.kp-group-label{font-size:10.5px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--high);margin-bottom:12px}
.kp-lead{display:flex;flex-direction:column;border:1px solid var(--border);border-radius:4px;background:var(--panel);overflow:hidden}
.kp-lead .kp{display:flex;gap:16px;align-items:baseline;padding:16px 20px;border-bottom:1px solid var(--border);
  box-shadow:inset 3px 0 0 var(--high)}
.kp-lead .kp:last-child{border-bottom:none}
.kp .kp-kind{font-family:var(--sans);font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--high);
  min-width:38px;flex:0 0 auto}
.kp .kp-main{min-width:0;flex:1}
.kp .kp-text{font-size:16.5px;line-height:1.7;color:var(--text)}
.kp-rest{margin-top:14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:8px 28px}
.kp-rest .kp{display:flex;gap:12px;align-items:baseline;padding:8px 2px}
.kp-rest .kp-kind{color:var(--faint)}
.kp-rest .kp-text{font-size:14.5px;color:var(--muted)}
.kp-rest .srcs{margin-top:4px}

/* 章节内 keypoints block：同一形态的中性版 */
.kp-block{display:flex;flex-direction:column;border:1px solid var(--border);border-radius:4px;background:var(--panel);overflow:hidden}
.kp-block .kp{display:flex;gap:16px;align-items:baseline;padding:13px 18px;border-bottom:1px solid var(--border)}
.kp-block .kp:last-child{border-bottom:none}
.kp-block .kp.high{box-shadow:inset 3px 0 0 var(--high)}
.kp-block .kp.medium{box-shadow:inset 3px 0 0 var(--warn)}
.kp-block .kp.low{box-shadow:inset 3px 0 0 var(--ok)}
.kp-block .kp-text{font-size:15.5px}

/* ===================== 冲突对照 ===================== */
.conflict{border:1px solid var(--border);border-radius:4px;overflow:hidden;background:var(--panel);margin-bottom:16px}
.conflict:last-child{margin-bottom:0}
.conflict .c-topic{padding:13px 20px;font-family:var(--serif);font-weight:700;font-size:16px;color:var(--text);
  background:var(--panel-2);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.c-tag{font-family:var(--sans);font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--high);
  border:1px solid var(--high);border-radius:3px;padding:1px 7px}
.positions{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.position{padding:16px 20px;border-right:1px solid var(--border)}
.position:last-child{border-right:none}
.position .pv{font-size:15.5px;line-height:1.6;color:var(--text)}
.resolution{padding:13px 20px;color:var(--ok);font-size:14px;background:rgba(33,122,75,.06);border-top:1px solid var(--border)}
.resolution::before{content:attr(data-label);color:var(--muted);font-weight:700}
@media (max-width:720px){.positions{grid-template-columns:1fr}.position{border-right:none;border-bottom:1px solid var(--border)}.position:last-child{border-bottom:none}}

/* ===================== 金句 ===================== */
.quote-grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(380px,1fr))}
.quote{border-left:3px solid var(--accent);padding:6px 0 6px 22px}
.quote .q-text{font-family:var(--serif);font-size:19px;line-height:1.6;font-weight:500;color:var(--text)}
.quote .q-attr{color:var(--muted);font-size:12.5px;margin-top:8px}
.quote .q-attr::before{content:"— "}

/* ===================== 章节详情（折叠卡片） ===================== */
section.chapter{padding:0;border:1px solid var(--border);border-radius:4px;background:var(--panel);
  margin-bottom:14px;overflow:hidden}
.chapter-head{display:flex;align-items:baseline;gap:14px;padding:16px 22px;cursor:pointer;user-select:none}
.chapter-head:hover{background:var(--panel-2)}
.chapter-head .ch-no{font-family:var(--serif);font-size:15px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.chapter-head h3{font-family:var(--serif);font-size:18.5px;font-weight:700;margin:0;flex:0 0 auto;color:var(--text)}
.chapter-head .ch-sum{flex:1;color:var(--muted);font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:60px}
.chapter-head .ch-meta{display:inline-flex;align-items:center;gap:10px;flex:0 0 auto}
.chapter-head .ch-toggle{font-family:var(--sans);border:none;background:transparent;color:var(--faint);font-size:12px;cursor:pointer;white-space:nowrap;padding:0}
section.chapter.collapsed .ch-body{display:none}
.ch-body{padding:6px 22px 24px;border-top:1px solid var(--border)}
.ch-body > .srcs:first-child{margin:12px 0 0}
.ch-blocks{display:flex;flex-direction:column;gap:20px;padding-top:16px}
.md{font-size:16px;line-height:1.75;color:var(--text)}
.md strong{color:var(--text);font-weight:700}
.md code{font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace;background:var(--panel-2);border:1px solid var(--border);border-radius:3px;padding:1px 6px;font-size:.9em}
.md em{font-style:italic}

.callout{border:1px solid var(--border);border-left:3px solid var(--info);border-radius:4px;
  padding:13px 18px;background:var(--paper)}
.callout .co-title{font-weight:700;font-size:14px;color:var(--info);margin-bottom:4px;font-family:var(--sans)}
.callout .md{font-size:14.5px;color:var(--muted)}
.callout.info{border-left-color:var(--info)} .callout.info .co-title{color:var(--info)}
.callout.warn{border-left-color:var(--warn)} .callout.warn .co-title{color:var(--warn)}
.callout.success{border-left-color:var(--success)} .callout.success .co-title{color:var(--success)}
.callout.danger{border-left-color:var(--danger)} .callout.danger .co-title{color:var(--danger)}

/* 章节内 metric block：小号指标（大数字只留给顶层 highlights） */
.mini-metrics{border:1px solid var(--border);border-radius:4px;background:var(--paper);padding:14px 18px}
.mini-metrics .mm-title{font-family:var(--serif);font-weight:700;font-size:14.5px;margin-bottom:10px;color:var(--text)}
.mini-metrics .mm-row{display:flex;flex-wrap:wrap;gap:10px 26px}
.mini-metric .mv{font-family:var(--serif);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--text)}
.mini-metric.high .mv{color:var(--high)}
.mini-metric .ml{font-size:11px;color:var(--muted);margin-top:2px}
.mini-metric .msub{font-size:10.5px;color:var(--faint)}
.mini-metric .srcs{margin-top:3px}

.tbl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:4px;background:var(--panel)}
table.data{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
table.data th,table.data td{padding:9px 16px;text-align:left;border-bottom:1px solid var(--border)}
table.data thead th{font-family:var(--sans);font-weight:700;font-size:11px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--muted);background:var(--panel-2);border-bottom:2px solid var(--rule)}
table.data td:first-child{font-weight:600;color:var(--text)}
table.data tbody tr:last-child td{border-bottom:none}
table.data tbody tr:hover{background:var(--panel-2)}
.fig-title{font-family:var(--serif);font-weight:700;font-size:15.5px;margin:0 0 10px;color:var(--text)}

.img-block{text-align:center}
.img-block img{max-width:100%;border:1px solid var(--border);border-radius:4px;box-shadow:var(--shadow-sm)}
.img-missing{display:inline-block;padding:30px 36px;border:1px dashed var(--rule);border-radius:4px;color:var(--faint);font-size:13px;font-family:var(--sans)}
.img-block .fig-cap{margin-top:10px}

.subsecs{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px}
.subsec{border:1px solid var(--border);border-radius:4px;padding:12px 16px;background:var(--paper)}
.subsec .ss-title{font-weight:700;font-size:14.5px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;color:var(--text)}
.subsec .ss-id{color:var(--accent);font-family:var(--serif);font-size:12.5px}
.subsec .ss-sum{color:var(--muted);font-size:13px;margin-top:3px}

/* 章节内嵌图/图表容器 */
.ch-blocks .stage{margin-bottom:0}
.ch-blocks .chart-box{border-color:var(--border)}

/* ===================== 附录（降调区） ===================== */
.appendix{margin-top:64px;border-top:2px solid var(--text);padding-top:10px;color:var(--muted)}
.appendix .ap-label{font-size:10.5px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--faint);
  display:flex;justify-content:space-between;padding-bottom:18px}
.appendix h4{font-family:var(--serif);font-size:15px;color:var(--text);margin:26px 0 12px}
.ap-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 34px}
@media (max-width:860px){.ap-grid{grid-template-columns:1fr}}
.file-tbl td,.file-tbl th{font-size:13px}
.frel{border:1px solid var(--border);border-radius:4px;background:var(--panel);padding:14px;text-align:center}
.frel .mermaid svg{max-width:100%;height:auto}
.frel-note{font-size:12.5px;color:var(--faint);margin-top:8px}
.distill{display:flex;flex-wrap:wrap;gap:6px 22px;font-size:12.5px;align-items:baseline}
.distill .d-item b{font-family:var(--serif);color:var(--text);font-size:15px;margin-left:5px;font-variant-numeric:tabular-nums}
.distill .d-item.warn b{color:var(--warn)}
.distill .d-fc{flex-basis:100%;color:var(--ok);font-size:12.5px}
details.fc-details{margin-top:12px}
details.fc-details summary{cursor:pointer;font-size:12px;color:var(--accent);user-select:none}
details.fc-details .tbl-wrap{margin-top:10px}
.fc-verdict{font-weight:700;white-space:nowrap}
.fc-verdict.ok{color:var(--ok)} .fc-verdict.deviation{color:var(--warn)}
.fc-verdict.error{color:var(--high)} .fc-verdict.missing{color:var(--muted)}
footer.foot{color:var(--faint);font-size:11px;font-family:var(--sans);letter-spacing:.1em;text-transform:uppercase;
  border-top:1px solid var(--rule);padding-top:14px;margin-top:44px;text-align:center}

/* ===================== 降级提示 ===================== */
.empty{color:var(--faint);font-style:italic}
.lib-missing{border:1px dashed var(--warn);border-radius:4px;padding:10px 14px;margin-bottom:12px;
  color:var(--warn);font-family:var(--sans);font-size:12.5px;letter-spacing:.02em;text-align:left}
.mmd-src{background:var(--panel-2);border:1px solid var(--border);border-radius:4px;padding:14px 16px;
  font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;line-height:1.6;
  overflow-x:auto;text-align:left;white-space:pre;color:var(--text);margin:0}

/* ===================== 放大浮层 ===================== */
#dlg-modal{position:fixed;inset:0;background:rgba(20,15,8,.82);z-index:100;display:none;align-items:center;justify-content:center;padding:26px}
#dlg-modal.open{display:flex}
#dlg-modal .dlg-inner{background:var(--panel);border-radius:6px;max-width:96vw;max-height:92vh;overflow:auto;padding:28px;box-shadow:var(--shadow);cursor:grab}
#dlg-modal .dlg-inner.dragging{cursor:grabbing}
#dlg-modal .dlg-inner svg{max-width:none;height:auto;display:block;margin:0 auto}
#dlg-close{position:fixed;top:18px;right:22px;border:none;background:var(--panel);color:#272019;border-radius:50%;
  width:40px;height:40px;font-size:21px;cursor:pointer;line-height:1;z-index:101}
.dlg-tools{position:fixed;top:18px;left:22px;z-index:101;display:inline-flex;border-radius:4px;overflow:hidden;
  border:1px solid var(--rule);box-shadow:var(--shadow-sm)}
.dlg-tools button{font-family:var(--sans);border:none;background:var(--panel);color:#272019;font-size:13px;
  padding:9px 14px;cursor:pointer;border-right:1px solid var(--border);line-height:1;min-width:40px}
.dlg-tools button:last-child{border-right:none}
.dlg-tools button:hover{background:var(--panel-2)}
.dlg-hint{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);color:#d8cbb0;font-size:12px;font-family:var(--sans);z-index:101}

.filtered-out{display:none !important}

/* 目录树精确跳转后的目标高亮 */
.flash{animation:da-flash 1.6s ease}
@keyframes da-flash{0%{background:var(--mark)}100%{background:transparent}}

@media print{
  #sidebar,#menu-toggle,#sb-backdrop,#dlg-modal{display:none !important}
  #main{margin-left:0}
  section{break-inside:avoid}
  section.chapter.collapsed .ch-body{display:block !important}
  .ch-toggle,#mode-btn,.diagram-zoom{display:none !important}
}
</style>
</head>
<body>
<!-- ====== 渲染器数据注入位（唯一，禁止预填数据；renderer 替换下方 token）====== -->
<script id="dashboard-data" type="application/json">__DASHBOARD_DATA__</script>

<div id="layout">
  <aside id="sidebar">
    <div id="side-content"></div>
  </aside>
  <div id="sb-backdrop"></div>
  <main id="main">
    <button id="menu-toggle" aria-label="菜单">☰</button>
    <div class="sheet">
      <div id="app"></div>
      <footer class="foot" id="foot"></footer>
    </div>
  </main>
</div>

<!-- 逻辑/关系图放大浮层（初始 fit-to-view，支持缩放/平移） -->
<div id="dlg-modal" aria-hidden="true">
  <button id="dlg-close" aria-label="关闭">×</button>
  <div class="dlg-tools" id="dlg-tools">
    <button type="button" data-z="out" aria-label="缩小">−</button>
    <button type="button" data-z="in" aria-label="放大">＋</button>
    <button type="button" data-z="fit">Fit</button>
    <button type="button" data-z="100">100%</button>
  </div>
  <div class="dlg-inner" id="dlg-inner"></div>
  <div class="dlg-hint" id="dlg-hint"></div>
</div>

<script>
/* =====================================================================
   doc-atlas 前端 app —— 纯内联，离线运行。
   读取 #dashboard-data 注入的 model（renderer 已把图片替换为 dataURI）。
   所有字段缺省都优雅降级：缺省即不渲染对应模块。
   ===================================================================== */
(function(){
  "use strict";

  // ---------- 安全读取注入数据 ----------
  var MODEL = {};
  try {
    var node = document.getElementById('dashboard-data');
    MODEL = JSON.parse(node.textContent) || {};
  } catch (e) {
    document.getElementById('app').innerHTML =
      '<p style="color:#b23a2e">注入数据解析失败：' + esc(String(e)) + '</p>';
    return;
  }

  var meta     = MODEL.meta || {};
  var files    = Array.isArray(MODEL.files) ? MODEL.files : [];
  var outline  = Array.isArray(MODEL.outline) ? MODEL.outline : [];
  var chapters = Array.isArray(MODEL.chapters) ? MODEL.chapters : [];

  // 界面语言：跟随用户在阶段零选定的 ui_lang（en 走英文，其余走中文）
  var UI = String(meta.ui_lang || meta.content_lang || 'zh').toLowerCase();
  var EN = UI.indexOf('en') === 0;
  function tx(zh, en){ return EN ? en : zh; }
  try { document.documentElement.setAttribute('lang', EN ? 'en' : (UI || 'zh')); } catch (e){}

  // outline 任意节点 id → summary（章节头一句话概括）
  var summaryById = {};
  (function idx(nodes){
    if (!Array.isArray(nodes)) return;
    nodes.forEach(function(n){
      if (n && n.id != null && n.summary) summaryById[String(n.id)] = n.summary;
      if (n && Array.isArray(n.children)) idx(n.children);
    });
  })(outline);

  var fileMap = {};
  files.forEach(function(f){ if (f && f.id != null) fileMap[f.id] = f; });
  var quoteMap = indexById(MODEL.quotes);
  var diagramMap = indexById(MODEL.diagrams);
  var chartMap = indexById(MODEL.charts);

  // 待执行的渲染任务（Mermaid 文本 / Chart 配置），DOM 注入后统一处理
  var mermaidTasks = [];   // { id, code }
  var chartTasks = [];     // { id, cfg }
  var mermaidSeq = 0, chartSeq = 0;

  // ============================ 工具函数 ============================
  function esc(s){
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;');
  }
  function indexById(arr){
    var m = {};
    if (Array.isArray(arr)) arr.forEach(function(o){ if (o && o.id != null) m[o.id] = o; });
    return m;
  }
  function isArr(x){ return Array.isArray(x) && x.length > 0; }
  function truncate(s, n){ s = String(s == null ? '' : s); return s.length > n ? s.slice(0, n - 1) + '…' : s; }
  function fileIdsOf(arr){
    var s = {};
    (Array.isArray(arr) ? arr : []).forEach(function(x){ if (x && x.file_id != null) s[x.file_id] = true; });
    return Object.keys(s);
  }
  function collectFileIds(node, set){
    if (!node || typeof node !== 'object') return;
    if (Array.isArray(node)){ node.forEach(function(x){ collectFileIds(x, set); }); return; }
    if (node.file_id != null) set[node.file_id] = true;
    Object.keys(node).forEach(function(k){ var v = node[k]; if (v && typeof v === 'object') collectFileIds(v, set); });
  }

  // 极简 inline markdown：**bold** *em* `code`，先转义再替换（避免 XSS）
  function mdInline(s){
    var t = esc(s);
    t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    t = t.replace(/`([^`]+)`/g, '<code>$1</code>');
    t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
    t = t.replace(/\n/g, '<br>');
    return t;
  }
  // 数字/单位高亮：只用于定论、执行摘要、重点要点（避免满屏黄）
  var HL_RE = /(\d[\d,\.]*\s?(?:kWh|kW|dB|℃|°C|°|%|km\/h|km|m³|m3|V\b|A\b|h\b|小时|分钟|秒|升\/?时?|升|吨|公里|万元|万|亿|元|次|年|月|天|页|字|倍|人|pp))/g;
  function hlNums(html){
    return String(html).split(/(<[^>]+>)/).map(function(seg){
      if (seg.charAt(0) === '<') return seg;
      return seg.replace(HL_RE, '<mark class="hl">$1</mark>');
    }).join('');
  }
  function mdInlineHL(s){ return hlNums(mdInline(s)); }

  // SourceRef → 极小角标（全站唯一样式）
  function srcLabel(s){
    if (!s || typeof s !== 'object') return '';
    var f = fileMap[s.file_id];
    var name = f && f.name ? f.name : (s.file_id != null ? String(s.file_id) : '?');
    var locPart = '';
    if (s.page != null && s.page !== '') locPart = 'p.' + s.page;
    else if (s.loc) locPart = s.loc;
    return '<span class="src" title="' + esc(name) + '"><b>' + esc(truncate(name, 22)) + '</b>' +
           (locPart ? ' ' + esc(locPart) : '') + '</span>';
  }
  function srcsHtml(arr){
    if (!isArr(arr)) return '';
    return '<div class="srcs">' + arr.map(srcLabel).join('') + '</div>';
  }
  function oneSrcHtml(s){
    if (!s) return '';
    return '<div class="srcs">' + srcLabel(s) + '</div>';
  }
  var IMP_ZH = EN ? { high:'Key', medium:'Normal', low:'Ref' } : { high:'重点', medium:'一般', low:'参考' };
  function impBadge(imp){
    if (!imp) return '';
    return '<span class="badge ' + esc(imp) + '">' + esc(IMP_ZH[imp] || imp) + '</span>';
  }

  // 顶层 highlights：全页唯一的大数字卡
  function metricItemsHtml(items){
    if (!isArr(items)) return '';
    return '<div class="metrics">' + items.map(function(m){
      if (!m || typeof m !== 'object') return '';
      var cls = m.importance === 'high' ? ' high' : '';
      var h = '<div class="metric' + cls + '">';
      h += '<div class="mv">' + esc(m.value) + '</div>';
      h += '<div class="ml">' + esc(m.label) + '</div>';
      if (m.sub) h += '<div class="msub">' + esc(m.sub) + '</div>';
      h += srcsHtml(m.sources) + '</div>';
      return h;
    }).join('') + '</div>';
  }
  // 章节内 metric block：小号指标行（大数字只留给顶层）
  function miniMetricsHtml(title, items, sources){
    if (!isArr(items)) return '';
    var h = '<div class="mini-metrics">';
    if (title) h += '<div class="mm-title">' + esc(title) + '</div>';
    h += '<div class="mm-row">' + items.map(function(m){
      if (!m || typeof m !== 'object') return '';
      var cls = m.importance === 'high' ? ' high' : '';
      var x = '<div class="mini-metric' + cls + '"><div class="mv">' + esc(m.value) + '</div>' +
              '<div class="ml">' + esc(m.label) + '</div>';
      if (m.sub) x += '<div class="msub">' + esc(m.sub) + '</div>';
      x += srcsHtml(m.sources) + '</div>';
      return x;
    }).join('') + '</div>' + srcsHtml(sources) + '</div>';
    return h;
  }

  // 注册 mermaid 任务，返回占位 HTML（stage=true 用主角容器）
  function mermaidPlaceholder(code, title, caption, srcs){
    if (!code) return '';
    var id = 'mmd-' + (++mermaidSeq);
    mermaidTasks.push({ id: id, code: String(code) });
    var h = '<div class="stage">';
    if (title) h += '<div class="fig-title" style="font-size:18px">' + esc(title) + '</div>';
    h += '<div class="diagram-wrap" title="' + tx('点击放大', 'Click to enlarge') + '">' +
         '<button class="diagram-zoom" type="button" tabindex="-1">⤢ ' + tx('放大', 'Zoom') + '</button>' +
         '<div class="mermaid" id="' + id + '"></div></div>';
    if (caption || isArr(srcs)){
      h += '<div class="fig-foot">' +
           (caption ? '<span class="fig-cap">' + esc(caption) + '</span>' : '<span></span>') +
           (isArr(srcs) ? srcsHtml(srcs) : '') + '</div>';
    }
    h += '</div>';
    return h;
  }
  // 注册 chart 任务，返回占位 HTML
  function chartPlaceholder(cfg, title, caption, srcs){
    if (!cfg || typeof cfg !== 'object') return '';
    var id = 'cht-' + (++chartSeq);
    chartTasks.push({ id: id, cfg: cfg });
    var h = '<div class="chart-box">';
    if (title) h += '<div class="fig-title" style="font-size:16.5px">' + esc(title) + '</div>';
    h += '<div class="chart-canvas-box"><canvas id="' + id + '"></canvas></div>';
    if (caption || isArr(srcs)){
      h += '<div class="fig-foot">' +
           (caption ? '<span class="fig-cap">' + esc(caption) + '</span>' : '<span></span>') +
           (isArr(srcs) ? srcsHtml(srcs) : '') + '</div>';
    }
    h += '</div>';
    return h;
  }

  // ============================ 报头 + 定论 ============================
  function renderMasthead(){
    var s = meta.stats || {};
    var d = MODEL.distillation_report || {};

    var line = [];
    if (s.file_count != null) line.push('<span><b>' + esc(s.file_count) + '</b>' + tx(' 份来源',' source file(s)') + '</span>');
    if (s.total_pages != null) line.push('<span><b>' + esc(s.total_pages) + '</b>' + tx(' 页',' pages') + '</span>');
    if (s.total_words != null) line.push('<span><b>' + esc(Number(s.total_words).toLocaleString('en-US')) + '</b>' + tx(' 字',' words') + '</span>');
    if (s.reading_minutes != null) line.push('<span>' + tx('原文约 ','source ≈ ') + '<b>' + esc(s.reading_minutes) + '</b>' + tx(' 分钟',' min') + '</span>');
    // 本页阅读时长：由 model_words 估算（zh ~400 字/分，en ~200 词/分）
    if (d && typeof d.model_words === 'number' && d.model_words > 0){
      var mins = Math.max(1, Math.round(d.model_words / (EN ? 200 : 400)));
      line.push('<span class="save">' + tx('本页约 ' + mins + ' 分钟读完','this page ≈ ' + mins + ' min') + '</span>');
    }
    if (meta.reading_goal){
      line.push('<span class="goal">' + tx('阅读目标','Reading goal') + ' <b>' + esc(meta.reading_goal) + '</b></span>');
    }

    var h = '<div class="masthead">';
    h += '<div class="mh-top"><span>' + tx('doc-atlas · 文档简报', 'doc-atlas · document briefing') +
         '</span><span class="mh-right">' + esc(meta.generated_at || '') + '</span></div>';
    h += '<h1 class="doc-title">' + esc(meta.title || 'doc-atlas') + '</h1>';
    if (line.length) h += '<div class="doc-meta">' + line.join('') + '</div>';
    h += '</div>';

    // 定论条：meta.one_liner 优先；缺省回退 executive_summary[0]
    var es = Array.isArray(meta.executive_summary) ? meta.executive_summary : [];
    var verdict = meta.one_liner || (es.length ? es[0] : null);
    if (verdict){
      h += '<div class="verdict" id="sec-verdict">' +
           '<div class="v-label">' + tx('The Bottom Line · 一句话定论','The Bottom Line') + '</div>' +
           '<div class="v-text">' + mdInlineHL(verdict) + '</div></div>';
    }
    return h;
  }

  // ============================ 简报区各段 ============================
  // 每段返回 {id, title, cnt, body} 或 null；assemble 统一编号装配。

  function secHighlights(){
    if (!isArr(MODEL.highlights)) return null;
    return { id:'sec-highlights', title:tx('关键指标','Key metrics'),
             cnt:tx('全篇 ' + MODEL.highlights.length + ' 个最关键数字', MODEL.highlights.length + ' key numbers'),
             body: metricItemsHtml(MODEL.highlights) };
  }

  function secSummary(){
    var es = Array.isArray(meta.executive_summary) ? meta.executive_summary : [];
    // one_liner 缺省时 es[0] 已被定论条使用，摘要列表从 es[1] 起
    var items = meta.one_liner ? es : es.slice(1);
    if (!items.length) return null;
    return { id:'sec-summary', title:tx('执行摘要','Executive summary'), cnt:null,
             body: '<div class="abstract"><ol>' +
                   items.map(function(x){ return '<li>' + mdInlineHL(x) + '</li>'; }).join('') +
                   '</ol></div>' };
  }

  function secDiagrams(){
    if (!isArr(MODEL.diagrams)) return null;
    return { id:'sec-diagrams', title:tx('核心逻辑','Core logic'), cnt:null,
             body: MODEL.diagrams.map(function(d){
               return mermaidPlaceholder(d.mermaid, d.title, d.caption, d.sources);
             }).join('') };
  }

  function secCharts(){
    if (!isArr(MODEL.charts)) return null;
    return { id:'sec-charts', title:tx('数据图表','Charts'), cnt:null,
             body: '<div class="chart-grid">' + MODEL.charts.map(function(c){
               return chartPlaceholder(c.chartjs, c.title, c.caption, c.sources);
             }).join('') + '</div>' };
  }

  function kpHtml(k, lead){
    var imp = k.importance || 'medium';
    var h = '<div class="kp" data-imp="' + esc(imp) + '" data-files="' + esc(fileIdsOf(k.sources).join(',')) + '">';
    if (k.kind) h += '<span class="kp-kind">' + esc(k.kind) + '</span>';
    h += '<div class="kp-main"><div class="kp-text">' + (lead ? mdInlineHL(k.text) : mdInline(k.text)) + '</div>' +

  function secKeypoints(){

  function quoteHtml(text, attr, src){
    var h = '<div class="quote"><div class="q-text">' + mdInline(text) + '</div>';

      var f = fileMap[src.file_id];

  // ============================ Block 调色板 ============================
  function renderBlock(b){
    if (!b || typeof b !== 'object') return '';
    switch (b.type){
      case 'paragraph':
        return '<div class="md">' + mdInline(b.md) + srcsHtml(b.sources) + '</div>';

      case 'callout': {
        var tone = b.tone || 'info';
        var h = '<div class="callout ' + esc(tone) + '">';
        if (b.title) h += '<div class="co-title">' + esc(b.title) + '</div>';
        h += '<div class="md">' + mdInline(b.md) + '</div>' + srcsHtml(b.sources) + '</div>';
        return h;
      }

      case 'keypoints': {
        var its = (Array.isArray(b.items) ? b.items : []).map(function(it){
          var imp = it.importance || 'medium';
          return '<div class="kp ' + esc(imp) + '">' +
                 '<div class="kp-main"><div class="kp-text">' + mdInline(it.text) + '</div>' +
                 srcsHtml(it.sources) + '</div></div>';
        }).join('');
        return '<div class="kp-block">' + its + '</div>';
      }

      case 'metric':
        return miniMetricsHtml(b.title, b.items, b.sources);

      case 'quote': {
        if (b.quote_id != null){
          var q = quoteMap[b.quote_id];
          if (q) return quoteHtml(q.text, q.attribution, q.source);
          return '<div class="quote empty">' + tx('（引用的金句 ' + esc(b.quote_id) + ' 不存在）','(missing quote ' + esc(b.quote_id) + ')') + '</div>';
        }
        return quoteHtml(b.text, b.attribution, b.source);
      }

      case 'diagram': {
        if (b.diagram_id != null){
          var d = diagramMap[b.diagram_id];
          if (d) return mermaidPlaceholder(d.mermaid, d.title, d.caption, d.sources);
          return '<div class="empty">' + tx('（引用的关系图 ' + esc(b.diagram_id) + ' 不存在）','(missing diagram ' + esc(b.diagram_id) + ')') + '</div>';
        }
        return mermaidPlaceholder(b.mermaid, b.title, b.caption, b.sources);
      }

      case 'chart': {
        if (b.chart_id != null){
          var c = chartMap[b.chart_id];
          if (c) return chartPlaceholder(c.chartjs, c.title, c.caption, c.sources);
          return '<div class="empty">' + tx('（引用的图表 ' + esc(b.chart_id) + ' 不存在）','(missing chart ' + esc(b.chart_id) + ')') + '</div>';
        }
        return chartPlaceholder(b.chartjs, b.title, b.caption, b.sources);
      }

      case 'table': {
        var cols = Array.isArray(b.columns) ? b.columns : [];
        var rows = Array.isArray(b.rows) ? b.rows : [];
        var h = '';
        if (b.title) h += '<div class="fig-title">' + esc(b.title) + '</div>';
        h += '<div class="tbl-wrap"><table class="data"><thead><tr>' +
             cols.map(function(c){return '<th>'+esc(c)+'</th>';}).join('') + '</tr></thead><tbody>';
        rows.forEach(function(r){
          h += '<tr>' + (Array.isArray(r) ? r : []).map(function(cell){return '<td>'+esc(cell)+'</td>';}).join('') + '</tr>';
        });
        h += '</tbody></table></div>' + srcsHtml(b.sources);
        return h;
      }

      case 'image': {
        var src = b.src;
        var h = '<div class="img-block">';
        if (src){
          h += '<img src="' + esc(src) + '" alt="' + esc(b.caption || '') + '">';
        } else {
          h += '<div class="img-missing">' + tx('图片缺失','image missing') + '</div>';
        }
        if (b.caption) h += '<div class="fig-cap">' + esc(b.caption) + '</div>';
        h += oneSrcHtml(b.source) + '</div>';
        return h;
      }

      case 'subsections': {
        var its2 = (Array.isArray(b.items) ? b.items : []).map(function(it){
          // 每个子节带 node-<id> 锚点，目录树据此精确跳转
          var h = '<div class="subsec"' + (it.id ? ' id="node-' + esc(it.id) + '"' : '') + '>';
          h += '<div class="ss-title"><span class="ss-id">' + esc(it.id || '') + '</span>' +
               esc(it.title || '') + (it.importance === 'high' ? impBadge('high') : '') + '</div>';
          if (it.summary) h += '<div class="ss-sum">' + mdInline(it.summary) + '</div>';
          h += srcsHtml(it.sources) + '</div>';
          return h;
        }).join('');
        return '<div class="subsecs">' + its2 + '</div>';
      }

      default:
        return ''; // 未知类型优雅跳过
    }
  }

      left += '<div class="frel diagram-wrap" style="min-height:0;cursor:zoom-in"><div class="mermaid" id="' + relId + '"></div></div>';
      if (fr.note) left += '<div class="frel-note">' + esc(fr.note) + '</div>';
    }
    if (hasDistill){
      right += '<h4>' + apNo() + ' · ' + tx('炼化体检（为什么可以信这份简报）','Distillation check') + '</h4>';
      var chips = [];
      function chip(label, val, cls){
        if (val != null && val !== '') chips.push('<span class="d-item' + (cls ? ' ' + cls : '') + '">' + esc(label) + '<b>' + esc(val) + '</b></span>');
      }
      var cov = d.section_coverage != null ? d.section_coverage :
        (d.sections_mapped != null && d.sections_total != null ? d.sections_mapped + '/' + d.sections_total : null);
      var comp = d.compression_ratio != null ? d.compression_ratio :
        (d.compression_ratio_x != null ? (tx('约 ','~') + d.compression_ratio_x + ':1') : null);
      var srcRate = d.claims_with_source != null ? d.claims_with_source :
        (d.claims_with_source_count != null && d.claims_total != null ? d.claims_with_source_count + '/' + d.claims_total : null);
      var todo = d.todo_ratio != null ? d.todo_ratio :
        (d.todo_count != null ? String(d.todo_count) : null);
      chip(tx('压缩比','Compression'), comp);
      chip(tx('章节覆盖','Coverage'), cov);
      chip(tx('溯源率','Sourced'), srcRate);
      chip(tx('待核实','To-verify'), todo, 'warn');
      chip(tx('派生数字','Derived'), d.derived_numbers);
      var dh = '<div class="distill">' + chips.join('');
      if (d.fact_check) dh += '<span class="d-fc">✔ ' + tx('事实核查：','Fact-check: ') + esc(d.fact_check) + '</span>';
      dh += '</div>';
      // 核查明细（fact_check_items 给了才有）
      if (isArr(d.fact_check_items)){
        dh += '<details class="fc-details"><summary>' +
              tx('核查明细（' + d.fact_check_items.length + ' 条）','Details (' + d.fact_check_items.length + ')') +
              '</summary><div class="tbl-wrap"><table class="data file-tbl"><thead><tr><th>' +

              tx('出处','Source') + '</th><th>' + tx('处理','Action') + '</th></tr></thead><tbody>';
        d.fact_check_items.forEach(function(it){
          if (!it || typeof it !== 'object') return;
          var v = FC_VERDICT[it.verdict] || null;
          dh += '<tr><td class="fc-verdict ' + esc(it.verdict || '') + '">' +
                (v ? (EN ? v.en : v.zh) : esc(it.verdict || '')) + '</td><td>' + esc(it.claim || '') +
                '</td><td>' + (it.source ? srcLabel(it.source) : '') + '</td><td>' + esc(it.note || '') + '</td></tr>';
        });
        dh += '</tbody></table></div></details>';
      }
      right += dh;

    return '<div class="appendix" id="appendix">' +
           '<div class="ap-label"><span>Appendix · ' + tx('附录','Appendix') + '</span><span>' +
           tx('源文件与可信度','Sources & trust') + '</span></div>' +
           '<div class="ap-grid"><div>' + left + '</div><div>' + right + '</div></div></div>';

  var NAV = [];   // {no, id, title} 供侧栏简报导航

  // ============================ 导航与交互 ============================
  var MOBILE_BP = 920;   // 与 CSS 断点保持一致
  function setSidebar(open){
    var sb = document.getElementById('sidebar');
    var bd = document.getElementById('sb-backdrop');
    if (sb) sb.classList.toggle('open', open);
    if (bd) bd.classList.toggle('show', open && window.innerWidth <= MOBILE_BP);
  }
  function bindNav(){
    document.querySelectorAll('.tree-row').forEach(function(row){
      row.addEventListener('click', function(e){
        var li = row.parentElement;
        var toggle = row.querySelector('.toggle');
        if (e.target === toggle && li.querySelector('ul')){
          li.classList.toggle('collapsed');
          toggle.textContent = li.classList.contains('collapsed') ? '▸' : '▾';
          return;
        }
        var nid = row.getAttribute('data-id');
        var precise = nid ? document.getElementById('node-' + nid) : null;
        var anchor = row.getAttribute('data-anchor');
        var target = precise || (anchor ? document.querySelector(anchor) : null);
        if (target){
          var chSec = target.closest ? target.closest('section.chapter') :
            (target.classList && target.classList.contains('chapter') ? target : null);
          if (chSec && chSec.classList.contains('collapsed')){
            setChapter(chSec, false); updateModeBtn();
          }
          target.scrollIntoView({behavior:'smooth', block:'start'});
          if (precise){
            precise.classList.remove('flash');
            void precise.offsetWidth;
            precise.classList.add('flash');
          }
          document.querySelectorAll('.tree-row.active').forEach(function(r){r.classList.remove('active');});
          row.classList.add('active');
        }
        if (window.innerWidth <= MOBILE_BP){ setSidebar(false); }
      });
    });
    document.querySelectorAll('#nav-brief a, .nav-brief a').forEach(function(a){
      a.addEventListener('click', function(){
        if (window.innerWidth <= MOBILE_BP){ setSidebar(false); }
      });
    });
    var mt = document.getElementById('menu-toggle');
    if (mt){
      mt.addEventListener('click', function(){
        var sb = document.getElementById('sidebar');
        setSidebar(!(sb && sb.classList.contains('open')));
      });
    }
    var bd = document.getElementById('sb-backdrop');
    if (bd) bd.addEventListener('click', function(){ setSidebar(false); });
  }

  // 校验过的五色（--c1..--c5），顺序固定不轮换
  function chartPalette(){
    return [cssVar('--c1')||'#2b5fb0', cssVar('--c2')||'#b23a2e', cssVar('--c3')||'#a9761c',
            cssVar('--c4')||'#217a4b', cssVar('--c5')||'#0d7fa5'];
  }
  function hexA(hex, a){
    var m = /^#?([0-9a-fA-F]{6})$/.exec(String(hex||'').trim());
    if (!m) return hex;
    var n = parseInt(m[1],16);
    return 'rgba(' + ((n>>16)&255) + ',' + ((n>>8)&255) + ',' + (n&255) + ',' + a + ')';
  }
  function applyChartPalette(cfg){
    var pal = chartPalette(), type = cfg.type || 'bar';
    var dss = (cfg.data && Array.isArray(cfg.data.datasets)) ? cfg.data.datasets : [];
    var pie = (type === 'pie' || type === 'doughnut' || type === 'polarArea');
    dss.forEach(function(ds, i){
      if (pie){
        var n = ((cfg.data.labels||[]).length) || ((ds.data||[]).length) || pal.length;
        if (ds.backgroundColor == null) ds.backgroundColor = Array.apply(null,{length:n}).map(function(_,k){ return pal[k % pal.length]; });
        if (ds.borderColor == null) ds.borderColor = '#fffdf7';
        if (ds.borderWidth == null) ds.borderWidth = 2;
      } else if (type === 'line' || type === 'radar'){
        var c = pal[i % pal.length];
        if (ds.borderColor == null) ds.borderColor = c;
        if (ds.backgroundColor == null) ds.backgroundColor = hexA(c, .12);
        if (ds.pointBackgroundColor == null) ds.pointBackgroundColor = c;
        if (ds.pointRadius == null) ds.pointRadius = 3;
        if (ds.borderWidth == null) ds.borderWidth = 2;
        if (ds.tension == null) ds.tension = .32;
        if (ds.fill == null) ds.fill = (type === 'line');
      } else {
        var c2 = pal[i % pal.length];
        if (ds.backgroundColor == null) ds.backgroundColor = (dss.length === 1) ? hexA(c2, .85) : c2;
        if (ds.borderColor == null) ds.borderColor = c2;
        if (ds.borderWidth == null) ds.borderWidth = 0;
        if (ds.borderRadius == null) ds.borderRadius = {topLeft:4, topRight:4};
        if (ds.borderSkipped == null) ds.borderSkipped = 'bottom';
        if (ds.maxBarThickness == null) ds.maxBarThickness = 48;
      }
    });
  }
  function chartFallbackTable(cfg){
    try {
      var data = (cfg && cfg.data) || {};
      var labels = Array.isArray(data.labels) ? data.labels : [];
      var dss = Array.isArray(data.datasets) ? data.datasets : [];
      if (!labels.length && !dss.length) return '';
      var h = '<div class="tbl-wrap"><table class="data"><thead><tr><th></th>';
      dss.forEach(function(ds, i){ h += '<th>' + esc(ds.label || ('#' + (i + 1))) + '</th>'; });
      h += '</tr></thead><tbody>';
      labels.forEach(function(lb, i){
        h += '<tr><td>' + esc(lb) + '</td>';
        dss.forEach(function(ds){
          var v = (Array.isArray(ds.data) ? ds.data : [])[i];
          h += '<td>' + esc(v == null ? '' : v) + '</td>';
        });
        h += '</tr>';
      });
      h += '</tbody></table></div>';
      return h;
    } catch (e){ return ''; }
  }
  function libMissingNote(what){
    return '<div class="lib-missing">⚠ ' +
      tx(what + '库未能加载（可能是 --cdn 渲染且当前无网络）。已降级显示，重新联网刷新或用默认内联模式重渲染可恢复。',
         what + ' library failed to load (offline with --cdn build?). Showing fallback; re-render with the default inline mode to fix.') +
      '</div>';
  }
  function renderAllCharts(){
    if (typeof Chart === 'undefined'){
      chartTasks.forEach(function(t){
        var el = document.getElementById(t.id);
        if (!el) return;
        var box = el.closest ? el.closest('.chart-canvas-box') : null;
        if (!box) return;
        box.style.height = 'auto';
        box.innerHTML = libMissingNote(tx('图表', 'Chart')) + chartFallbackTable(t.cfg);
      });
      return;
    }
    chartTasks.forEach(function(t){
      var el = document.getElementById(t.id);
      if (!el) return;
      try {
        var cfg = JSON.parse(JSON.stringify(t.cfg));   // 深拷贝防 Chart 改写原对象
        if (!cfg.type) cfg.type = 'bar';
        if (!cfg.data) cfg.data = {labels:[],datasets:[]};
        if (!cfg.options) cfg.options = {};
        if (cfg.options.maintainAspectRatio == null) cfg.options.maintainAspectRatio = false;
        if (cfg.options.responsive == null) cfg.options.responsive = true;
        applyChartPalette(cfg);
        chartInstances.push(new Chart(el.getContext('2d'), cfg));
      } catch (err){
        if (window.console) console.warn('chart render failed', t.id, err);
      }
    });
  }

  // ============================ Mermaid ============================
  function mermaidThemeVars(){
    var panel = cssVar('--panel') || '#fffdf7';
    var text = cssVar('--text') || '#272019';
    var ruleC = cssVar('--rule') || '#cdbf9f';
    var muted = cssVar('--muted') || '#6a5f4e';
    var accent = cssVar('--accent') || '#2b5fb0';
    var panel2 = cssVar('--panel-2') || '#f1e9d9';
    var paper = cssVar('--paper') || '#faf6ee';
    return {
      fontFamily: "-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif",
      fontSize: '15.5px',
      primaryColor: panel, primaryTextColor: text, primaryBorderColor: accent,
      secondaryColor: panel2, secondaryTextColor: text, secondaryBorderColor: ruleC,
      tertiaryColor: paper, tertiaryTextColor: text, tertiaryBorderColor: ruleC,
      lineColor: muted, textColor: text, titleColor: text, nodeTextColor: text,
      mainBkg: panel, nodeBorder: accent, clusterBkg: panel2, clusterBorder: ruleC,
      edgeLabelBackground: paper,
      actorBkg: panel, actorBorder: accent, actorTextColor: text,
      actorLineColor: muted, signalColor: muted, signalTextColor: text,
      labelBoxBkgColor: panel2, labelBoxBorderColor: ruleC, labelTextColor: text,
      loopTextColor: text, noteBkgColor: cssVar('--mark') || '#f7e08a',
      noteTextColor: cssVar('--mark-ink') || '#4a3a07', noteBorderColor: ruleC,
      pie1: cssVar('--c1')||'#2b5fb0', pie2: cssVar('--c2')||'#b23a2e', pie3: cssVar('--c3')||'#a9761c',
      pie4: cssVar('--c4')||'#217a4b', pie5: cssVar('--c5')||'#0d7fa5'
    };
  }
  function renderAllMermaid(){
    if (!mermaidTasks.length){ return; }
    if (typeof mermaid === 'undefined'){
      mermaidTasks.forEach(function(t){
        var el = document.getElementById(t.id);
        if (!el) return;
        el.innerHTML = libMissingNote(tx('逻辑图', 'Diagram')) +
          '<pre class="mmd-src">' + esc(t.code) + '</pre>';
      });
      return;
    }
    try {
      mermaid.initialize({
        startOnLoad:false, securityLevel:'strict',
        theme:'base', themeVariables: mermaidThemeVars(),
        flowchart: { useMaxWidth: true, padding: 12 }
      });
    } catch (e){}
    mermaidTasks.forEach(function(t, i){
      var el = document.getElementById(t.id);
      if (!el) return;
      var gid = 'mermaidGraph' + i + '_' + Date.now();
      try {
        var ret = mermaid.render(gid, t.code);
        if (ret && typeof ret.then === 'function'){
          ret.then(function(res){ el.innerHTML = res.svg; })
             .catch(function(err){ el.innerHTML = '<div class="empty">' + tx('图渲染失败','render failed') + '</div>'; if(window.console) console.warn('mermaid', err); });
        } else if (ret && ret.svg){
          el.innerHTML = ret.svg;
        } else if (typeof ret === 'string'){
          el.innerHTML = ret;
        }
      } catch (err){
        el.innerHTML = '<div class="empty">' + tx('图渲染失败','render failed') + '</div>';
        if (window.console) console.warn('mermaid render failed', t.id, err);
      }
    });
  }

  // ============================ 筛选：重要度 + 来源文件 ============================
  var FILT = { imps: { high:true, medium:true, low:true }, srcs: {} };
  files.forEach(function(f){ if (f && f.id != null) FILT.srcs[f.id] = true; });

  function passes(el){
    var imp = el.getAttribute('data-imp') || 'medium';
    if (!FILT.imps[imp]) return false;
    var raw = el.getAttribute('data-files') || '';
    var fids = raw ? raw.split(',') : [];
    if (fids.length){
      var anyOn = fids.some(function(id){ return FILT.srcs[id]; });
      if (!anyOn) return false;
    }
    return true;
  }
  function applyFilters(){
    document.querySelectorAll('#sec-keypoints .kp[data-imp]').forEach(function(el){ el.classList.toggle('filtered-out', !passes(el)); });
    document.querySelectorAll('section.chapter[data-imp]').forEach(function(el){ el.classList.toggle('filtered-out', !passes(el)); });
    document.querySelectorAll('.tree-row[data-imp]').forEach(function(row){
      var li = row.parentElement;
      if (li) li.classList.toggle('filtered-out', !passes(row));
    });
    // 分组容器/整节跟随隐藏
    var sec = document.getElementById('sec-keypoints');
    if (sec){
      ['.kp-lead', '.kp-rest'].forEach(function(sel){
        var g = sec.querySelector(sel);
        if (g) g.classList.toggle('filtered-out', !g.querySelector('.kp:not(.filtered-out)'));
      });
      var lbl = sec.querySelector('.kp-group-label');
      var leadBox = sec.querySelector('.kp-lead');
      if (lbl && leadBox) lbl.classList.toggle('filtered-out', leadBox.classList.contains('filtered-out'));
      sec.classList.toggle('filtered-out', !sec.querySelector('.kp:not(.filtered-out)'));
    }
  }

  // ============================ 全文搜索（高亮 + 跳转） ============================
  var SKIP_NODES = { SCRIPT:1, STYLE:1, NOSCRIPT:1, CANVAS:1, MARK:1, BUTTON:1 };
  function clearHighlights(){
    var root = document.getElementById('app');
    if (!root) return;
    var marks = root.querySelectorAll('mark.search-hit');
    marks.forEach(function(m){ m.parentNode.replaceChild(document.createTextNode(m.textContent), m); });
    root.normalize();
  }
  function runSearch(q){
    clearHighlights();
    q = (q || '').trim();
    var cnt = document.getElementById('q-count');
    var root = document.getElementById('app');
    if (!q || !root){ if (cnt) cnt.textContent = ''; return; }
    var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
      acceptNode: function(n){
        if (!n.nodeValue || !n.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
        var p = n.parentNode;
        while (p && p !== root){
          if (SKIP_NODES[p.nodeName]) return NodeFilter.FILTER_REJECT;
          if (p.nodeName && p.nodeName.toLowerCase() === 'svg') return NodeFilter.FILTER_REJECT;
          if (p.classList && (p.classList.contains('mermaid') || p.classList.contains('diagram-wrap'))) return NodeFilter.FILTER_REJECT;
          p = p.parentNode;
        }
        return NodeFilter.FILTER_ACCEPT;
      }
    });
    var nodes = [], n; while ((n = walker.nextNode())) nodes.push(n);
    var ql = q.toLowerCase(), total = 0, first = null;
    nodes.forEach(function(tn){
      var text = tn.nodeValue, low = text.toLowerCase(), idx = low.indexOf(ql);
      if (idx < 0) return;
      var frag = document.createDocumentFragment(), pos = 0;
      while (idx >= 0){
        if (idx > pos) frag.appendChild(document.createTextNode(text.slice(pos, idx)));
        var mk = document.createElement('mark'); mk.className = 'search-hit';
        mk.textContent = text.slice(idx, idx + q.length);
        frag.appendChild(mk); if (!first) first = mk; total++;
        pos = idx + q.length; idx = low.indexOf(ql, pos);
      }
      if (pos < text.length) frag.appendChild(document.createTextNode(text.slice(pos)));
      tn.parentNode.replaceChild(frag, tn);
    });
    if (total){
      var expanded = false;
      root.querySelectorAll('mark.search-hit').forEach(function(mk){
        var sec = mk.closest ? mk.closest('section.chapter.collapsed') : null;
        if (sec){ setChapter(sec, false); expanded = true; }
      });
      if (expanded) updateModeBtn();
    }
    if (cnt) cnt.textContent = total ? (total + tx(' 处匹配',' matches')) : tx('无匹配','No match');
    if (first) first.scrollIntoView({ behavior:'smooth', block:'center' });
  }

  // ============================ 工具区事件绑定 ============================
  function bindToolbar(){
    var q = document.getElementById('q');
    var box = q && q.parentNode;
    if (q){
      var timer;
      q.addEventListener('input', function(){
        if (box) box.classList.toggle('has-val', !!q.value);
        clearTimeout(timer);
        timer = setTimeout(function(){ runSearch(q.value); }, 180);
      });
    }
    var clr = document.getElementById('q-clear');
    if (clr && q){
      clr.addEventListener('click', function(){
        q.value = ''; if (box) box.classList.remove('has-val'); runSearch(''); q.focus();
      });
    }
    document.querySelectorAll('#imp-filter .chip').forEach(function(ch){
      ch.addEventListener('click', function(){
        var imp = ch.getAttribute('data-imp');
        FILT.imps[imp] = !FILT.imps[imp];
        ch.classList.toggle('off', !FILT.imps[imp]);
        applyFilters();
      });
    });
    document.querySelectorAll('#src-filter .chip').forEach(function(ch){
      ch.addEventListener('click', function(){
        var fid = ch.getAttribute('data-fid');
        FILT.srcs[fid] = !FILT.srcs[fid];
        ch.classList.toggle('off', !FILT.srcs[fid]);
        applyFilters();
      });
    });
  }

  // ============================ 滚动定位高亮（scrollspy） ============================
  function setupScrollSpy(){
    if (typeof IntersectionObserver === 'undefined') return;
    // 简报导航
    var links = document.querySelectorAll('#nav-brief a');
    if (links.length){
      var byId = {};
      links.forEach(function(a){ byId[a.getAttribute('href').slice(1)] = a; });
      var obs1 = new IntersectionObserver(function(es){
        es.forEach(function(e){
          if (!e.isIntersecting) return;
          var a = byId[e.target.id];
          if (!a) return;
          links.forEach(function(x){ x.classList.remove('active'); });
          a.classList.add('active');
        });
      }, { rootMargin:'-10% 0px -70% 0px', threshold:0 });
      Object.keys(byId).forEach(function(id){
        var el = document.getElementById(id);
        if (el) obs1.observe(el);
      });
    }
    // 目录树
    var secs = Array.prototype.slice.call(document.querySelectorAll('section.chapter'));
    if (secs.length){
      var rowsByAnchor = {};
      document.querySelectorAll('.tree-row').forEach(function(r){
        var a = r.getAttribute('data-anchor') || '';
        (rowsByAnchor[a] = rowsByAnchor[a] || []).push(r);
      });
      var obs2 = new IntersectionObserver(function(entries){
        entries.forEach(function(en){
          if (!en.isIntersecting) return;
          var anchor = '#ch-' + en.target.getAttribute('data-chapter');
          document.querySelectorAll('.tree-row.active').forEach(function(r){ r.classList.remove('active'); });
          (rowsByAnchor[anchor] || []).forEach(function(r){ r.classList.add('active'); });
        });
      }, { rootMargin: '-12% 0px -70% 0px', threshold: 0 });
      secs.forEach(function(s){ obs2.observe(s); });
    }
  }

  // ============================ 章节折叠 / 模式切换 ============================
  function resizeChartsSoon(){
    setTimeout(function(){ chartInstances.forEach(function(c){ try { c.resize(); } catch (e){} }); }, 30);
  }
  function setChapter(sec, collapsed){
    if (!sec) return;
    sec.classList.toggle('collapsed', collapsed);
    var btn = sec.querySelector('.ch-toggle');
    if (btn) btn.textContent = collapsed ? tx('展开 ▸','Expand ▸') : tx('收起 ▾','Collapse ▾');
    if (!collapsed) resizeChartsSoon();
  }
  function setAllChapters(collapsed){
    document.querySelectorAll('section.chapter').forEach(function(sec){ setChapter(sec, collapsed); });
  }
  function updateModeBtn(){
    var btn = document.getElementById('mode-btn');
    if (!btn) return;
    var anyOpen = !!document.querySelector('section.chapter:not(.collapsed)');
    btn.innerHTML = anyOpen ? ('🎯 ' + tx('只看简报','Briefing only')) : ('📖 ' + tx('展开全文','Expand all'));
  }
  function bindChapterToggles(){
    document.querySelectorAll('section.chapter').forEach(function(sec){
      var head = sec.querySelector('.chapter-head');
      if (!head) return;
      head.addEventListener('click', function(){
        setChapter(sec, !sec.classList.contains('collapsed'));
        updateModeBtn();
      });
    });
  }
  function bindModeToggle(){
    var btn = document.getElementById('mode-btn');
    if (!btn) return;
    btn.addEventListener('click', function(){
      var anyOpen = !!document.querySelector('section.chapter:not(.collapsed)');
      setAllChapters(anyOpen);
      updateModeBtn();
    });
  }

  // ============================ 逻辑/关系图放大浮层 ============================
  var DLG = { scale: 1, w: 0, h: 0 };
  function dlgSvg(){
    var inner = document.getElementById('dlg-inner');
    return inner ? inner.querySelector('svg') : null;
  }
  function dlgApply(){
    var svg = dlgSvg();
    if (!svg || !DLG.w) return;
    svg.style.width = Math.max(40, Math.round(DLG.w * DLG.scale)) + 'px';
    svg.style.height = 'auto';
  }
  function dlgFitScale(){
    var availW = window.innerWidth * 0.92 - 56;
    var availH = window.innerHeight * 0.92 - 56;
    if (!DLG.w || !DLG.h) return 1;
    return Math.min(availW / DLG.w, availH / DLG.h, 1.5);
  }
  function dlgSetScale(s){
    DLG.scale = Math.min(Math.max(s, 0.15), 6);
    dlgApply();
  }
  function openDiagramModal(svgHtml){
    var modal = document.getElementById('dlg-modal'), inner = document.getElementById('dlg-inner');
    if (!modal || !inner) return;
    inner.innerHTML = svgHtml;
    var svg = inner.querySelector('svg');
    if (svg){
      svg.removeAttribute('width'); svg.removeAttribute('height');
      var w = 0, h = 0;
      try {
        var vb = svg.viewBox && svg.viewBox.baseVal;
        if (vb && vb.width > 0){ w = vb.width; h = vb.height; }
      } catch (e){}
      if (!w){
        try { var bb = svg.getBBox(); w = bb.width || 800; h = bb.height || 500; }
        catch (e){ w = 800; h = 500; }
      }
      DLG.w = w; DLG.h = h;
      dlgSetScale(dlgFitScale());
    }
    var hint = document.getElementById('dlg-hint');
    if (hint) hint.textContent = tx('滚轮缩放 · 拖拽平移 · 点击空白处或按 Esc 关闭',
                                    'Scroll to zoom · drag to pan · click outside or press Esc to close');
    modal.classList.add('open'); modal.setAttribute('aria-hidden','false');
  }
  function closeDiagramModal(){
    var modal = document.getElementById('dlg-modal');
    if (!modal) return;
    modal.classList.remove('open'); modal.setAttribute('aria-hidden','true');
    var inner = document.getElementById('dlg-inner'); if (inner) inner.innerHTML = '';
  }
  function bindDiagramZoom(){
    var app = document.getElementById('app');
    if (app){
      app.addEventListener('click', function(e){
        var wrap = e.target.closest ? e.target.closest('.diagram-wrap') : null;
        if (!wrap) return;
        var m = wrap.querySelector('.mermaid');
        if (!m || !m.querySelector('svg')) return;
        openDiagramModal(m.innerHTML);
      });
    }
    var closeBtn = document.getElementById('dlg-close');
    if (closeBtn) closeBtn.addEventListener('click', closeDiagramModal);
    var modal = document.getElementById('dlg-modal');
    if (modal) modal.addEventListener('click', function(e){ if (e.target === modal) closeDiagramModal(); });
    document.addEventListener('keydown', function(e){ if (e.key === 'Escape') closeDiagramModal(); });
    var tools = document.getElementById('dlg-tools');
    if (tools){
      tools.addEventListener('click', function(e){
        var btn = e.target.closest ? e.target.closest('button[data-z]') : null;
        if (!btn) return;
        var z = btn.getAttribute('data-z');
        if (z === 'in') dlgSetScale(DLG.scale * 1.25);
        else if (z === 'out') dlgSetScale(DLG.scale / 1.25);
        else if (z === 'fit') dlgSetScale(dlgFitScale());
        else if (z === '100') dlgSetScale(1);
      });
    }
    if (modal){
      modal.addEventListener('wheel', function(e){
        if (!modal.classList.contains('open')) return;
        e.preventDefault();
        dlgSetScale(DLG.scale * (e.deltaY < 0 ? 1.12 : 1 / 1.12));
      }, { passive: false });
    }
    var inner = document.getElementById('dlg-inner');
    if (inner){
      var drag = null;
      inner.addEventListener('mousedown', function(e){
        drag = { x: e.clientX, y: e.clientY, sl: inner.scrollLeft, st: inner.scrollTop };
        inner.classList.add('dragging');
        e.preventDefault();
      });
      document.addEventListener('mousemove', function(e){
        if (!drag) return;
        inner.scrollLeft = drag.sl - (e.clientX - drag.x);
        inner.scrollTop = drag.st - (e.clientY - drag.y);
      });
      document.addEventListener('mouseup', function(){
        drag = null; inner.classList.remove('dragging');
      });
    }
  }

  // ============================ 启动 ============================
  function start(){
    assemble();
    buildSidebar();
    bindNav();
    bindToolbar();
    bindChapterToggles();
    bindModeToggle();
    bindDiagramZoom();
    applyChartTheme();
    renderAllCharts();
    renderAllMermaid();
    applyFilters();
    setupScrollSpy();
    updateModeBtn();
  }

  if (document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', start);
  } else {
    start();
  }
})();
</script>
